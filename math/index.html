<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <link rel="shortcut icon" href="../favicon.ico" type="image/x-icon">
  <title>哪吒学数学</title>
  <link rel="stylesheet" href="index.css">
  <script src="../js/lib/vue.global.prod.min.js"></script>
  <link rel="stylesheet" href="../css/cloud.css">
  <link rel="stylesheet" href="../css/ux.css">
  <link rel="stylesheet" href="direct-entry.css">
</head>
<body class="math-page">
  <div id="app" v-cloak>
    <!-- 控制选项区 -->
    <div class="controls">
      <select v-model="range" aria-label="新题范围"><option value="10">10以内</option><option value="99">100以内</option></select>
      <label>
        <input type="checkbox" v-model="hasSub"> 包含减法
      </label>
      <button @click="requestProblems">换一组题</button>
      <button class="on" @click="checkAnswers">检查答案</button>
    </div>
    <p class="math-help">点击每题的答案框，直接输入数字。按回车可到下一题；范围设置在换题后生效。</p>
    <p class="math-feedback" role="status">{{ feedback || '已填写 ' + answeredCount + ' / ' + problems.length + ' 题' }}</p>
    <dialog ref="resetDialog" aria-labelledby="reset-title"><h2 id="reset-title">换一组新题？</h2><p>当前这组题和答案将被替换。也可以继续完成当前练习。</p><div class="dialog-actions"><button @click="$refs.resetDialog.close()">继续做题</button><button @click="$refs.resetDialog.close(); generateProblems()">确认换题</button></div></dialog>

    <!-- 题目展示区 -->
     <div class="main-content">
       <div class="problems-grid">
         <label
           v-for="(problem, index) in problems" 
           :key="index"
           class="problem"
           :class="{ active: activeIndex === index }"
         >
           <span>{{ problem.num1 }} {{ problem.operator }} {{ problem.num2 }} =</span>
           <input class="answer-box" type="text" inputmode="numeric" pattern="[0-9]*" maxlength="3" autocomplete="off" enterkeyhint="next" placeholder="?"
             :value="currentAnswer(index)" :aria-label="'第' + (index + 1) + '题：' + problem.num1 + problem.operator + problem.num2 + '的答案'"
             :aria-invalid="checked && !isCorrect(index)" :class="{ correct: checked && isCorrect(index), wrong: checked && !isCorrect(index) }"
             @focus="activeIndex = index" @input="updateAnswer(index, $event)" @keydown.enter.prevent="nextProblem(index)">
         </label>
       </div>
     </div>

    <div class="math-finish"><button class="on" @click="checkAnswers">检查本组答案</button></div>
  </div>

  <script src="../js/config.js"></script>
  <script src="../js/auth-client.js"></script>
  <script src="../js/utils.js"></script>
  <script src="index.js"></script>
</body>
</html>
